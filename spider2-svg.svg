<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    
    <linearGradient id="greyCol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141b24" />
      <stop offset="45%" stop-color="#273442" />
      <stop offset="100%" stop-color="#121a24" />
    </linearGradient>

    <linearGradient id="blueCol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#073463" />
      <stop offset="50%" stop-color="#0e5b9e" />
      <stop offset="100%" stop-color="#062c52" />
    </linearGradient>

    <linearGradient id="redBleed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b81422" stop-opacity="0" />
      <stop offset="65%" stop-color="#b81422" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#e62232" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="suitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d91629" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#8a0c18" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#030508" stop-opacity="0.72" />
    </radialGradient>

    
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#aeb9c7" />
      <stop offset="52%" stop-color="#eef3f8" />
      <stop offset="78%" stop-color="#5d6978" />
      <stop offset="100%" stop-color="#c4cedb" />
    </linearGradient>

    
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dfc0" />
      <stop offset="35%" stop-color="#a88f63" />
      <stop offset="75%" stop-color="#5c4c31" />
      <stop offset="100%" stop-color="#2b2316" />
    </linearGradient>

    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e62232" />
      <stop offset="60%" stop-color="#1d7ad1" />
      <stop offset="100%" stop-color="#1d7ad1" stop-opacity="0" />
    </linearGradient>

    
    <filter id="bokehBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5.5" />
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="emblemShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    
    <radialGradient id="webFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="webMask">
      <circle cx="575" cy="145" r="145" fill="url(#webFade)" />
    </mask>
  </defs>

  <style>
    .bokeh-1 { animation: pulse 3.6s ease-in-out infinite; }
    .bokeh-2 { animation: pulse 4.4s ease-in-out 1.2s infinite; }
    .bokeh-3 { animation: pulse 3.1s ease-in-out 0.6s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }

    .emblem { animation: float 5s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translate(575px, 145px); }
      50%      { transform: translate(575px, 138px); }
    }

    .mini-spider { animation: climb 7.5s ease-in-out infinite; }
    @keyframes climb {
      0%, 100% { transform: translate(735px, 42px); }
      50%      { transform: translate(735px, 152px); }
    }

    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>

  
  <rect width="800" height="300" fill="#070a0f" />

  
  <rect x="0" y="0" width="90" height="120" fill="#3a1e14" opacity="0.45" filter="url(#softGlow)" />

  
  <rect x="110" y="0" width="235" height="300" fill="url(#greyCol)" />
  <rect x="345" y="0" width="315" height="300" fill="url(#blueCol)" />

  
  <rect x="590" y="0" width="210" height="300" fill="url(#redBleed)" filter="url(#softGlow)" />

  
  <g filter="url(#bokehBlur)">
    <circle class="bokeh-1" cx="42" cy="232" r="9" fill="#b81d24" />
    <circle class="bokeh-2" cx="78" cy="226" r="10" fill="#ff1e2e" />
    <circle class="bokeh-3" cx="80" cy="248" r="11" fill="#ff2a3a" />
    <circle class="bokeh-2" cx="722" cy="246" r="11" fill="#ff2434" />
    <circle class="bokeh-1" cx="696" cy="214" r="6" fill="#a81622" />
  </g>

  
  <circle cx="575" cy="145" r="150" fill="url(#suitGlow)" />
  <g mask="url(#webMask)" stroke="#dce4f0" stroke-width="1" fill="none">
    
    <line x1="575" y1="145" x2="575" y2="0" />
    <line x1="575" y1="145" x2="575" y2="290" />
    <line x1="575" y1="145" x2="430" y2="145" />
    <line x1="575" y1="145" x2="720" y2="145" />
    <line x1="575" y1="145" x2="472" y2="42" />
    <line x1="575" y1="145" x2="678" y2="248" />
    <line x1="575" y1="145" x2="678" y2="42" />
    <line x1="575" y1="145" x2="472" y2="248" />
    <line x1="575" y1="145" x2="518" y2="10" />
    <line x1="575" y1="145" x2="632" y2="280" />
    <line x1="575" y1="145" x2="632" y2="10" />
    <line x1="575" y1="145" x2="518" y2="280" />
    
    <circle cx="575" cy="145" r="32" />
    <circle cx="575" cy="145" r="62" />
    <circle cx="575" cy="145" r="95" />
    <circle cx="575" cy="145" r="128" />
  </g>

  
  <g class="emblem" filter="url(#emblemShadow)">
    <g fill="url(#chrome)" stroke="#0c1017" stroke-width="1.2" stroke-linejoin="round">
      
      <path d="M 0,-26 L 9,-10 L 6,2 L 0,6 L -6,2 L -9,-10 Z" />
      <path d="M 0,4 L 11,17 L 8,38 L 0,66 L -8,38 L -11,17 Z" />

      
      <path d="M 6,-14 L 22,-34 L 27,-70 L 17,-82 L 21,-66 L 14,-36 L 3,-18 Z" />
      <path d="M 8,-8 L 37,-24 L 48,-58 L 40,-68 L 40,-54 L 29,-26 L 6,-11 Z" />
      <path d="M 8,0 L 39,-2 L 56,28 L 48,68 L 43,53 L 46,28 L 33,4 L 6,3 Z" />
      <path d="M 6,8 L 28,22 L 35,64 L 25,86 L 25,68 L 20,28 L 5,13 Z" />

      
      <path d="M -6,-14 L -22,-34 L -27,-70 L -17,-82 L -21,-66 L -14,-36 L -3,-18 Z" />
      <path d="M -8,-8 L -37,-24 L -48,-58 L -40,-68 L -40,-54 L -29,-26 L -6,-11 Z" />
      <path d="M -8,0 L -39,-2 L -56,28 L -48,68 L -43,53 L -46,28 L -33,4 L -6,3 Z" />
      <path d="M -6,8 L -28,22 L -35,64 L -25,86 L -25,68 L -20,28 L -5,13 Z" />
    </g>
  </g>

  
  <g class="mini-spider" opacity="0.85">
    <line x1="0" y1="-220" x2="0" y2="-4" stroke="#cfd6e6" stroke-width="1" opacity="0.65" />
    <g fill="none" stroke="#e8ecf5" stroke-width="1.4" stroke-linecap="round">
      <path d="M-3 -1 L-12 -5 L-14 -11" />
      <path d="M-3 2 L-13 3 L-16 9" />
      <path d="M-2 4 L-9 10 L-7 16" />
      <path d="M3 -1 L12 -5 L14 -11" />
      <path d="M3 2 L13 3 L16 9" />
      <path d="M2 4 L9 10 L7 16" />
    </g>
    <ellipse cx="0" cy="5" rx="4.2" ry="5.5" fill="#12151f" stroke="#e8ecf5" stroke-width="1" />
    <circle cx="0" cy="-4" r="3" fill="#12151f" stroke="#e8ecf5" stroke-width="1" />
    <circle cx="-1.2" cy="-4.5" r="0.9" fill="#ff2a3a" />
    <circle cx="1.2" cy="-4.5" r="0.9" fill="#ff2a3a" />
  </g>

  
  <rect width="800" height="300" fill="url(#vignette)" />

  
  <g transform="translate(56, 108)">
    
    <text x="2" y="-18" fill="#ff3b4a" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="12" letter-spacing="2.5" font-weight="bold">// DEV PROFILE</text>

    
    <text x="0" y="28" fill="#f5f8fc" font-family="&#39;Segoe UI&#39;, Ubuntu, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">jp864x</text>

    
    <rect x="2" y="42" width="240" height="3" rx="1.5" fill="url(#accentBar)" />

    
    <rect x="0" y="58" width="230" height="34" rx="6" fill="#090d14" fill-opacity="0.72" stroke="#2c3e55" stroke-width="1" />
    <text x="14" y="80" fill="#ff3b4a" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" font-weight="bold">&gt;</text>
    <text x="30" y="80" fill="#d8e3f0" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15">learning </text>
    <text x="112" y="80" fill="#58a6ff" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" font-weight="bold">C++</text>
    <rect class="cursor" x="144" y="67" width="8" height="15" fill="#ff3b4a" />
  </g>

  
  <g>
    
    <path d="M 0,276 L 236,276 Q 244,276 244,284 L 244,300" fill="none" stroke="url(#brass)" stroke-width="9" stroke-linecap="square" />
    <path d="M 0,273 L 236,273 Q 241,273 241,278" fill="none" stroke="#fff2d6" stroke-width="1.2" opacity="0.65" />

    
    <rect x="556" y="276" width="244" height="9" rx="2" fill="url(#brass)" />
    <line x1="558" y1="278" x2="800" y2="278" stroke="#fff2d6" stroke-width="1.2" opacity="0.6" />
  </g>
</svg>